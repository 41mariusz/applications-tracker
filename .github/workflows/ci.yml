name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
      - name: Database tests (atomic writes, RLS through functions)
        run: supabase test db
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          # Fixed webhook secret for the smoke's /api/alerts/issue steps; no Telegram secrets, so nothing is sent.
          printf 'ISSUES_WEBHOOK_SECRET=smoke-webhook-secret\n' >> .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          source supabase.env
          BASE_URL=http://localhost:4321 SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run smoke
      - name: Prepare E2E (Worker env, test user, browser)
        env:
          E2E_USERNAME: e2e@example.com
          E2E_PASSWORD: e2e-local-password
        run: |
          source supabase.env
          # The e2e build reads .dev.vars.e2e (CLOUDFLARE_ENV=e2e); only the local stack, never the service-role key.
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .dev.vars.e2e
          # No sign-up in the app: the user exists only in this local Supabase, created through the admin API.
          curl -sf -o /dev/null -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_USERNAME\",\"password\":\"$E2E_PASSWORD\",\"email_confirm\":true}"
          npx playwright install --with-deps chromium
      - name: E2E in a browser (Playwright, production build)
        env:
          E2E_USERNAME: e2e@example.com
          E2E_PASSWORD: e2e-local-password
        run: |
          # Astro 7 runs one preview server per project, whatever the port: stop the smoke preview,
          # then Playwright builds and starts its own (CLOUDFLARE_ENV=e2e) on 4321.
          npx astro preview stop
          for i in $(seq 1 30); do curl -s --max-time 2 -o /dev/null http://localhost:4321/ || break; sleep 1; done
          if curl -s --max-time 2 -o /dev/null http://localhost:4321/; then echo "::error title=Port busy::4321 still answers after astro preview stop"; exit 1; fi
          source supabase.env
          E2E_SUPABASE_URL="$API_URL" E2E_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npx playwright test
      - name: Previous code version passes its smoke on the new schema
        env:
          # Passed through env, never interpolated into the script (script-injection hygiene).
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Compatibility smoke::$1"; exit 1; }
          # "Previous code" = what production runs during and after `db push`:
          # the PR's base, or the commit main pointed to before this push (not HEAD~1).
          base="${BASE_PR:-$BASE_PUSH}"
          if [ -z "$base" ] || [ -z "${base//0/}" ]; then
            echo "::notice title=Compatibility smoke::no base; skipped"
            exit 0
          fi
          # The checkout is shallow: fetch the base commit itself so diff and worktree can see it.
          git fetch --no-tags --depth=1 origin "$base" || fail "base $base cannot be fetched (force-push?)"
          changed=$(git diff --name-only "$base" HEAD -- supabase/migrations)
          if [ -z "$changed" ]; then
            echo "::notice title=Compatibility smoke::no migration change; previous code already ran on this schema"
            exit 0
          fi
          # Applied migrations are never edited, renamed or deleted: only new files are allowed.
          edited=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- supabase/migrations)
          if [ -n "$edited" ]; then
            echo "::error title=Applied migration edited::$(echo "$edited" | paste -sd ' ')"
            exit 1
          fi
          # The local stack still holds the new schema (every head migration applied by `supabase start`).
          # Astro 7 runs one preview per project: make sure nothing from earlier steps holds 4321.
          npx astro preview stop
          for i in $(seq 1 30); do curl -s --max-time 2 -o /dev/null http://localhost:4321/ || break; sleep 1; done
          if curl -s --max-time 2 -o /dev/null http://localhost:4321/; then fail "4321 still answers after astro preview stop"; fi
          source supabase.env
          prev="$RUNNER_TEMP/prev"
          git worktree add --detach "$prev" "$base" || fail "worktree for $base could not be created"
          cd "$prev"
          # Same secrets as "Configure secrets for build and preview": the local stack only.
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
          npm ci || fail "npm ci failed for base $base"
          npm run build || fail "build failed for base $base"
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:4321/ || fail "base preview did not start on 4321"
          # The base commit's own smoke; it creates its own users through the admin API.
          status=0
          BASE_URL=http://localhost:4321 SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/smoke.mjs || status=$?
          npx astro preview stop
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  deploy:
    # Auto-deploy on merge: only after lint/build and the smoke test pass on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    # Cloudflare secrets may live in the "SUPABASE" environment; repository secrets are visible here too.
    environment: SUPABASE
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fail closed before anything else: deploy only when the cloud DB has every repo migration
      # (and its state can be read). Dependency-free, so it runs before npm ci.
      - name: Cloud database has every repo migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/check-cloud-migrations.mjs
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Surface failures as annotations (secrets are masked by GitHub), so the cause is visible on the run page.
          report() {
            local tail
            tail=$(grep -v '^\s*$' "$2" | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::${tail}"
          }
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing secrets::CLOUDFLARE_API_TOKEN set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo yes || echo no), CLOUDFLARE_ACCOUNT_ID set: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo yes || echo no)"
            exit 1
          fi
          npx wrangler whoami > whoami.log 2>&1 || { echo "::error title=wrangler whoami failed::Token rejected by Cloudflare (check CLOUDFLARE_API_TOKEN)"; exit 1; }
          # Each deployed version carries its commit (visible in `wrangler deployments list` and rollback).
          npx wrangler deploy --message "$GITHUB_SHA" --tag "${GITHUB_SHA::7}" > deploy.log 2>&1 || { report "wrangler deploy failed" deploy.log; exit 1; }
          tail -n 5 deploy.log
