name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
      - name: Database tests (atomic writes, RLS through functions)
        run: supabase test db
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          source supabase.env
          BASE_URL=http://localhost:4321 SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run smoke
      - name: Prepare E2E (Worker env, test user, browser)
        env:
          E2E_USERNAME: e2e@example.com
          E2E_PASSWORD: e2e-local-password
        run: |
          source supabase.env
          # The e2e build reads .dev.vars.e2e (CLOUDFLARE_ENV=e2e); only the local stack, never the service-role key.
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .dev.vars.e2e
          # No sign-up in the app: the user exists only in this local Supabase, created through the admin API.
          curl -sf -o /dev/null -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_USERNAME\",\"password\":\"$E2E_PASSWORD\",\"email_confirm\":true}"
          npx playwright install --with-deps chromium
      - name: E2E in a browser (Playwright, production build)
        env:
          E2E_USERNAME: e2e@example.com
          E2E_PASSWORD: e2e-local-password
          # The smoke preview above still holds 4321; Playwright builds and starts its own server here.
          E2E_PORT: 4322
        run: |
          source supabase.env
          E2E_SUPABASE_URL="$API_URL" E2E_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  deploy:
    # Auto-deploy on merge: only after lint/build and the smoke test pass on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    # Cloudflare secrets may live in the "SUPABASE" environment; repository secrets are visible here too.
    environment: SUPABASE
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Surface failures as annotations (secrets are masked by GitHub), so the cause is visible on the run page.
          report() {
            local tail
            tail=$(grep -v '^\s*$' "$2" | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::${tail}"
          }
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing secrets::CLOUDFLARE_API_TOKEN set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo yes || echo no), CLOUDFLARE_ACCOUNT_ID set: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo yes || echo no)"
            exit 1
          fi
          npx wrangler whoami > whoami.log 2>&1 || { echo "::error title=wrangler whoami failed::Token rejected by Cloudflare (check CLOUDFLARE_API_TOKEN)"; exit 1; }
          npx wrangler deploy > deploy.log 2>&1 || { report "wrangler deploy failed" deploy.log; exit 1; }
          tail -n 5 deploy.log
