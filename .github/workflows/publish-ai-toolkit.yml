# Validate and publish the shared AI toolkit (packages/ai-toolkit) to GitHub Packages
# (course lesson M5L4, decisions in context/changes/shared-ai-toolkit/).
# - validate (PRs and pushes touching the package): package.json + skill frontmatter, node:test,
#   npm pack, and a real `npm install` of the packed tarball in a scratch consumer
# - publish (pushes to main/master only): skipped when name@version is already in the registry,
#   so a push without a version bump does not fail with 409. Releasing = bump "version".
# The package has no dependencies and no lockfile: no `npm ci`.
name: Publish AI Toolkit

on:
  push:
    branches: [main, master]
    paths:
      - "packages/ai-toolkit/**"
      - ".github/workflows/publish-ai-toolkit.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "packages/ai-toolkit/**"
      - ".github/workflows/publish-ai-toolkit.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/ai-toolkit

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Package metadata and skill frontmatter
        run: node scripts/validate-package.mjs
      - name: Installer tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
      - name: Install the packed tarball in a scratch consumer
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          node scripts/consumer-check.mjs "$RUNNER_TEMP/$tarball"

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two quick pushes must not race to publish the same version (the loser would get a 409).
    concurrency:
      group: publish-ai-toolkit
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@41mariusz"
      - name: Publish unless this version is already in the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if found=$(npm view "$name@$version" version 2>"$RUNNER_TEMP/view.err"); then
            if [ "$found" = "$version" ]; then
              echo "::notice title=AI toolkit::$name@$version is already published; skipping (bump \"version\" to release)"
              exit 0
            fi
          elif ! grep -q 'E404' "$RUNNER_TEMP/view.err"; then
            # Only "not found" means "publish"; auth or registry errors must not be guessed past.
            echo "::error title=AI toolkit::npm view $name@$version failed: $(tr '\n' ' ' < "$RUNNER_TEMP/view.err")"
            exit 1
          fi
          npm publish --ignore-scripts
          echo "::notice title=AI toolkit::published $name@$version"
