# AI code review on every pull request to main (course lesson M5L3, from
# .claude/config-templates/m5l3-review.yml.template; decisions in context/changes/ci-cd-code-review/).
# - review events (opened, synchronize, reopened, label ai-cr:review): run the agent, comment with
#   the summary, label ai-cr:passed / ai-cr:failed, fail the job on "fail"
# - any other label event: replay the verdict from the PR's labels, no model call
# The job is never skipped: a skipped job counts as a passing required check. The ruleset on main
# requires the check "AI code review" (owner bypasses); direct pushes to main are not gated.
name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write # labels live on the issues API

concurrency:
  # Review events share one group per PR, so a newer push cancels an older review. Replay events
  # get a group of their own: they neither cancel a running review nor get cancelled.
  group: ai-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ai-cr:review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    # The required check's name: keep it stable (the ruleset on main refers to it).
    name: AI code review
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPLAY: ${{ github.event.action == 'labeled' && github.event.label.name != 'ai-cr:review' }}
      # Labels at the time of the event, as a JSON array of names.
      LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - name: Replay verdict from labels
        if: env.REPLAY == 'true'
        run: |
          node -e '
            const labels = JSON.parse(process.env.LABELS);
            if (labels.includes("ai-cr:passed")) {
              console.log("AI review verdict for this commit: pass");
              process.exit(0);
            }
            const reason = labels.includes("ai-cr:failed") ? "fail" : "none yet (push or add ai-cr:review)";
            console.log("::error title=AI review::AI review verdict for this commit: " + reason);
            process.exit(1);
          '

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.REPLAY != 'true'
        with:
          fetch-depth: 0 # full history, otherwise there is no base to diff against

      - name: Drop the previous verdict
        # A replay must never pass a commit nobody reviewed: no verdict label until this review ends.
        if: env.REPLAY != 'true'
        run: |
          for label in ai-cr:passed ai-cr:failed; do
            if node -e 'process.exit(JSON.parse(process.env.LABELS).includes(process.argv[1]) ? 0 : 1)' "$label"; then
              gh pr edit "$PR" --remove-label "$label"
            fi
          done

      - name: Compute diff
        if: env.REPLAY != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/pr.diff"

      - id: review
        if: env.REPLAY != 'true'
        uses: ./.github/actions/ai-reviewer
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
          diff-file: ${{ runner.temp }}/pr.diff
          model: ${{ vars.REVIEW_MODEL }}

      - name: Comment and label
        if: env.REPLAY != 'true' && steps.review.outputs.verdict != ''
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_FILE: ${{ steps.review.outputs.review-file }}
        run: |
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log("## AI Code Review: " + r.verdict + "\n\n" + r.summary)' "$REVIEW_FILE" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          gh label create ai-cr:passed --color 0E8A16 --description "AI code review passed" --force
          gh label create ai-cr:failed --color B60205 --description "AI code review failed" --force
          if [ "$VERDICT" = pass ]; then label=ai-cr:passed; else label=ai-cr:failed; fi
          gh pr edit "$PR" --add-label "$label"
          if node -e 'process.exit(JSON.parse(process.env.LABELS).includes("ai-cr:review") ? 0 : 1)'; then
            gh pr edit "$PR" --remove-label ai-cr:review
          fi

      - name: Gate on verdict
        if: env.REPLAY != 'true'
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          test "$VERDICT" = pass || { echo "::error title=AI review::AI review verdict: ${VERDICT:-missing}"; exit 1; }
